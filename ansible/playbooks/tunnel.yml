- name: Install the Cloudflare tunnel
  hosts: all
  become: true
  vars:
    tunnel_token: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=' ~ playbook_dir ~ '/../../terraform output -raw tunnel_token') }}"
  tasks:
    - name: Add the cloudflared repository
      ansible.builtin.deb822_repository:
        name: cloudflared
        types: deb
        uris: https://pkg.cloudflare.com/cloudflared
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: https://pkg.cloudflare.com/cloudflare-main.gpg

    - name: Install cloudflared
      ansible.builtin.apt:
        name: cloudflared
        update_cache: true

    - name: Let unattended-upgrades update cloudflared
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51unattended-upgrades-cloudflared
        content: |
          Unattended-Upgrade::Origins-Pattern {
              "site=pkg.cloudflare.com";
          };
        mode: "0644"

    - name: Create the cloudflared config directory
      ansible.builtin.file:
        path: /etc/cloudflared
        state: directory
        mode: "0700"

    - name: Write the tunnel token
      ansible.builtin.copy:
        dest: /etc/cloudflared/tunnel.env
        content: "TUNNEL_TOKEN={{ tunnel_token }}\n"
        mode: "0600"
      no_log: true
      notify: Restart cloudflared

    - name: Install the cloudflared service
      ansible.builtin.copy:
        dest: /etc/systemd/system/cloudflared.service
        mode: "0644"
        content: |
          [Unit]
          Description=Cloudflare Tunnel
          After=network-online.target
          Wants=network-online.target

          [Service]
          EnvironmentFile=/etc/cloudflared/tunnel.env
          ExecStart=/usr/bin/cloudflared --no-autoupdate --metrics 127.0.0.1:20241 tunnel run
          Restart=always
          RestartSec=5s
          DynamicUser=yes
          NoNewPrivileges=yes

          [Install]
          WantedBy=multi-user.target
      notify: Restart cloudflared

    - name: Enable and start cloudflared
      ansible.builtin.systemd_service:
        name: cloudflared
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart cloudflared
      ansible.builtin.systemd_service:
        name: cloudflared
        state: restarted
        daemon_reload: true
      async: 60
      poll: 0

    - name: Wait for the tunnel
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120
      listen: Restart cloudflared

- name: Bootstrap a fresh server
  hosts: all
  become: true

  tasks:
    # Only over the IP (fresh server): through the tunnel, upgrading cloudflared can restart it
    # and cut the run. Later updates come from unattended-upgrades.
    - name: Upgrade all packages (first run can take several minutes)
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      when: "'ProxyCommand' not in (ansible_ssh_common_args | default(''))"

    - name: Check whether the admin user exists
      ansible.builtin.command: id -u {{ admin_user }}
      register: admin_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Ask for the admin sudo password
      ansible.builtin.pause:
        prompt: "Sudo password for {{ admin_user }}"
        echo: false
      register: admin_password
      no_log: true
      when: admin_check.rc != 0

    - name: Confirm the admin sudo password
      ansible.builtin.pause:
        prompt: "Confirm sudo password for {{ admin_user }}"
        echo: false
      register: admin_password_confirm
      no_log: true
      when: admin_check.rc != 0

    - name: Check both passwords match
      ansible.builtin.assert:
        that:
          - admin_password.user_input | length > 0
          - admin_password.user_input == admin_password_confirm.user_input
        fail_msg: Passwords are empty or do not match
        quiet: true
      no_log: true
      when: admin_check.rc != 0

    - name: Create the admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        update_password: on_create
        password: "{{ admin_password.user_input | password_hash('sha512') if admin_check.rc != 0 else omit }}"

    - name: Install admin public keys
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', playbook_dir ~ '/../../authorized_keys.local') }}"
        exclusive: true

    - name: Harden SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AllowUsers {{ admin_user }}
          X11Forwarding no
          MaxAuthTries 3
        mode: "0644"
        validate: sshd -t -f %s
      notify: Restart SSH

    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Remove root's authorized keys
      ansible.builtin.file:
        path: /root/.ssh/authorized_keys
        state: absent

    # Only over the IP (fresh server), so the run is not cut when the firewall turns on.
    # lockdown.yml removes the rule at the end. Through the tunnel it is never added.
    - name: Allow SSH through the firewall
      community.general.ufw:
        rule: allow
        name: OpenSSH
      when: "'ProxyCommand' not in (ansible_ssh_common_args | default(''))"

    - name: Enable firewall, deny incoming by default
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

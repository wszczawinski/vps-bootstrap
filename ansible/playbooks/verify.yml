- name: Verify server hardening
  hosts: all
  become: true
  tasks:
    - name: Read effective SSH settings
      ansible.builtin.command: sshd -T
      register: sshd_config
      changed_when: false

    - name: Check SSH settings
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in sshd_config.stdout_lines"
          - "'passwordauthentication no' in sshd_config.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_config.stdout_lines"
          - "'allowusers ' ~ admin_user in sshd_config.stdout_lines"
          - "'x11forwarding no' in sshd_config.stdout_lines"
          - "'maxauthtries 3' in sshd_config.stdout_lines"

    - name: Read firewall status
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Check firewall is on, denies incoming and has no SSH rule
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"
          - "'deny (incoming)' in ufw_status.stdout"
          - "'OpenSSH' not in ufw_status.stdout"
          - "'22/tcp' not in ufw_status.stdout"

    - name: Read service states
      ansible.builtin.service_facts:

    - name: Check cloudflared is running and starts on boot
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['cloudflared.service'].state == 'running'"
          - "ansible_facts.services['cloudflared.service'].status == 'enabled'"

    - name: Check cloudflared does not run as root
      ansible.builtin.command: systemctl show -p User,DynamicUser cloudflared
      register: cloudflared_user
      changed_when: false
      failed_when: "'DynamicUser=yes' not in cloudflared_user.stdout"

    - name: Read the apt configuration
      ansible.builtin.command: apt-config dump
      register: apt_config
      changed_when: false

    - name: Check automatic updates are on and include cloudflared
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Unattended-Upgrade \"1\";' in apt_config.stdout_lines"
          - "'site=pkg.cloudflare.com' in apt_config.stdout"

    # update.yml holds cloudflared; an interrupted run would leave it held and stop its updates.
    - name: Read held packages
      ansible.builtin.command: apt-mark showhold
      register: held_packages
      changed_when: false

    - name: Check cloudflared is not held
      ansible.builtin.assert:
        that:
          - "'cloudflared' not in held_packages.stdout_lines"

    - name: Read the reboot flag
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Warn if a reboot is needed
      ansible.builtin.debug:
        msg: "Reboot required to finish updates: sudo reboot"
      when: reboot_flag.stat.exists

    - name: Read the tunnel token file
      ansible.builtin.stat:
        path: /etc/cloudflared/tunnel.env
      register: tunnel_env

    - name: Check the tunnel token file is root-only
      ansible.builtin.assert:
        that:
          - tunnel_env.stat.exists
          - tunnel_env.stat.mode == '0600'
          - tunnel_env.stat.pw_name == 'root'

    - name: Read root's authorized keys
      ansible.builtin.stat:
        path: /root/.ssh/authorized_keys
      register: root_keys

    - name: Check root has no authorized keys
      ansible.builtin.assert:
        that:
          - not root_keys.stat.exists

    - name: Check sudo asks the admin user for a password
      ansible.builtin.command: sudo -n true
      become: false
      register: sudo_check
      changed_when: false
      failed_when: "'a password is required' not in sudo_check.stderr"

    - name: Check from outside
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      block:
        - name: Try to log in as root from outside
          ansible.builtin.command: >
            ssh {{ ansible_ssh_common_args }}
            -o BatchMode=yes -o ConnectTimeout=10
            -i {{ ansible_ssh_private_key_file | expanduser }}
            root@{{ ansible_host }} true
          register: root_login
          changed_when: false
          failed_when: "'Permission denied' not in root_login.stderr"

        - name: Check the server offers only key login
          ansible.builtin.command: >
            ssh {{ ansible_ssh_common_args }}
            -o BatchMode=yes -o ConnectTimeout=10
            -o PreferredAuthentications=none
            {{ ansible_user }}@{{ ansible_host }} true
          register: auth_methods
          changed_when: false
          failed_when: "'Permission denied (publickey)' not in auth_methods.stderr"

        - name: Check SSH is closed on the public IP
          ansible.builtin.wait_for:
            host: "{{ ansible_facts['default_ipv4']['address'] }}"
            port: 22
            state: stopped
            timeout: 15
